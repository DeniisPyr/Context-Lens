# Serves the page and passes /api to the backend. nginx includes this file in its http
# block, which is where the maps and zones below have to be.
#
# For now the app runs on this machine only: compose.yaml publishes it on 127.0.0.1.
# To serve it to others, put it behind a proxy that adds HTTPS, and then:
# - set SECURE_COOKIES=true, so the browser sends the session cookie over HTTPS only;
# - add `set_real_ip_from <the proxy's address>;` and `real_ip_header X-Forwarded-For;`
#   to the server block, or every request seems to come from the proxy, and all the
#   clients share one rate limit;
# - pass on the proxy's X-Forwarded-Proto rather than $scheme, which would be http;
# - have the proxy send Strict-Transport-Security, which browsers ignore over HTTP.

# Docker's DNS, which `resolve` below asks again whenever an answer expires, so a
# backend container that is replaced with a new address is found again.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend {
    zone backend 64k;
    server backend:8000 resolve;
}

# Rate limits, for each client address. A request over a limit gets a 429 at once.
#
# The client's address for a POST, and for anything else an empty key, which no limit
# counts: so that the limits on logging in and uploading leave reading alone.
map $request_method $post_client {
    POST    $binary_remote_addr;
    default "";
}

# Logging in: 5 attempts a minute, after a burst of 3. Enough for a person who mistypes
# the password a few times, and far too slow to guess a long random one.
limit_req_zone $post_client zone=login:1m rate=5r/m;

# Asking: 10 questions a minute, after a burst of 5. Every question spends Gemini
# credits, and a person reads each answer before asking the next one.
limit_req_zone $binary_remote_addr zone=ask:1m rate=10r/m;

# Uploading: the page uploads several files one at a time, and a dataset holds up to
# 100 of them, so a burst of 100 lets a whole dataset be filled at once. After that, 30
# a minute, because each upload spends Gemini credits on its embeddings.
limit_req_zone $post_client zone=upload:1m rate=30r/m;

# Everything else under /api: reading datasets, documents and the session, which costs
# next to nothing. 10 a second after a burst of 50 is far more than the page needs, and
# stops only a runaway script.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 8080;
    server_name _;
    # Leaves the nginx version out of the Server header and error pages.
    server_tokens off;

    root /usr/share/nginx/html;

    # The backend refuses an upload over 1,000,000 bytes (MAX_UPLOAD_BYTES), but only
    # once Starlette has written the whole request to disk, so nginx refuses a much bigger
    # one first. It's a little over the limit, to leave room for the multipart encoding
    # around the file. Raise both together.
    client_max_body_size 2m;

    limit_req_status 429;

    # On every response, errors included, which is what `always` is for. A location with
    # an add_header of its own would get none of these, so no location below has one:
    # the cache headers come from `expires`, which doesn't count.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # As JSON with a `detail`, like the backend's errors, so the page shows the message.
    error_page 413 @too_large;
    error_page 429 @too_many_requests;

    location @too_large {
        default_type application/json;
        return 413 '{"detail": "The file is too large to upload."}';
    }

    location @too_many_requests {
        default_type application/json;
        return 429 '{"detail": "Too many requests. Please wait a minute and try again."}';
    }

    # The page. Any path that isn't a file gets index.html, so the app can handle it.
    location / {
        try_files $uri /index.html;
    }

    # Checked again on every visit (Cache-Control: no-cache), so a new build shows up at
    # once.
    location = /index.html {
        expires -1;
    }

    # The script index.html loads by name, before anything is drawn, to apply the stored
    # theme. Its name has no hash, so it's checked again on every visit too. A script from
    # this origin is what the Content Security Policy allows: only inline ones are refused.
    location = /theme-init.js {
        expires -1;
    }

    # Vite puts a hash of their content in these names, so a changed file gets a new
    # name, and the old one can be cached for a year. A missing one is a 404, not the page.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Only /api reaches the backend: its /docs and /openapi.json aren't passed on, and
    # get the page like any other path. The path is passed on as it is.
    #
    # Set here for every location below, none of which sets its own. Replaces any
    # X-Forwarded-For the client sent, since nginx is the first proxy it passes.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The slowest requests call Gemini, which can take up to 60 seconds a call: a question
    # makes more than one call, and a big upload embeds for a while.
    proxy_read_timeout 150s;

    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://backend;
    }

    location = /api/session {
        limit_req zone=login burst=3 nodelay;
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://backend;
    }

    location = /api/ask {
        limit_req zone=ask burst=5 nodelay;
        proxy_pass http://backend;
    }

    location ~ ^/api/datasets/[^/]+/documents$ {
        limit_req zone=upload burst=100 nodelay;
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://backend;
    }
}
